<!doctype html>
<html lang="zh-CN" data-dream-skin="active" data-dream-shell="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude 娘主题预览</title><link rel="stylesheet" href="./preview.css">
</head>
<body>
<div class="stage"><div class="backdrop"></div><div class="veil"></div></div>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-flower"></span><span>Claude</span></div>
    <button class="new-session">新建任务</button>
    <div class="nav-group">
      <div class="nav-label">工作区</div>
      <a class="nav-item active">首页</a>
      <a class="nav-item">任务</a>
      <a class="nav-item">项目</a>
    </div>
    <div class="conversation-group">
      <div class="nav-label">最近任务</div>
      <a class="conversation active">整理接口模块 <small>今天</small></a>
      <a class="conversation">检查构建错误 <small>昨天</small></a>
      <a class="conversation">读取项目文档 <small>周一</small></a>
    </div>
    <div class="sidebar-footer">本地主题</div>
  </aside>
  <main class="main">
    <header class="header"><span class="route">首页</span><button class="appearance" id="toggle">深色</button></header>
    <section class="home-content">
      <div class="home-space"><div class="home-mark">Claude</div></div>
      <div class="composer">
        <div class="composer-input">输入消息…</div>
        <div class="composer-bar"><span>选择项目</span><button>发送</button></div>
      </div>
    </section>
  </main>
</div>
<script>
const root = document.documentElement;
const toggle = document.getElementById('toggle');
toggle.addEventListener('click', () => {
  const dark = root.dataset.dreamShell === 'dark';
  root.dataset.dreamShell = dark ? 'light' : 'dark';
  toggle.textContent = dark ? '深色' : '浅色';
});
</script>
</body>
</html>
